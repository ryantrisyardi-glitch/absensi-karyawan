<style>

  --bg1:#0f172a; --bg2:#1e293b; --accent:#4f46e5; --accent2:#7c3aed;

body{

.glass{
  background:rgba(255,255,255,.82);

.card-anim{ animation:fadeSlideUp .45s cubic-bezier(.16,1,.3,1) both; }
@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes popIn{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }
@keyframes pulseRing{
  0%{ box-shadow:0 0 0 0 rgba(79,70,229,.45); }

  100%{ box-shadow:0 0 0 0 rgba(79,70,229,0); }

@keyframes shimmer{ 0%{background-position:-400px 0;} 100%{background-position:400px 0;} }
.skeleton{ background:linear-gradient(90deg,#e2e8f0 0px,#f1f5f9 40px,#e2e8f0 80px); background-size:600px 100%; animation:shimmer 1.4s infinite linear; border-radius:10px; }

.btn{ padding:.7rem 1.2rem; border-radius:14px; font-weight:600; transition:all .18s ease; cursor:pointer; border:none; display:inline-flex; align-items:center; justify-content:center; gap:.4rem; }
.btn:active{ transform:scale(.96); }
.btn-primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 6px 16px rgba(79,70,229,.35); }

.btn-danger:hover{ filter:brightness(1.08); }
.btn-outline{ border:1.5px solid #e2e8f0; background:#fff; color:#334155; }

input, select, textarea{ border:1.5px solid #e2e8f0; border-radius:12px; padding:.65rem .85rem; width:100%; font-size:.92rem; transition:border-color .15s, box-shadow .15s; background:#fff; }

const DAYS = [

/* =========================================================

const ICONS = {

  calendar: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  chart: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>`,
  edit: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
  trash: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`,
  plus: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  logout: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>`,
  check: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  x: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  map: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4Z"/><path d="M8 2v16M16 6v16"/></svg>`,
  shield: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>`,
  building: `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M9 6h.01M15 6h.01M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></svg>`,
};

/* =========================================================
   UTIL
========================================================= */
function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtTime(ts){
  if(!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('id-ID', {dateStyle:'medium', timeStyle:'short'});
}
function fmtClock(ts){
  if(!ts) return '-';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
}
function dateKey(ts){
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDateLabel(key){
  const d = new Date(key+'T00:00:00');
  return d.toLocaleDateString('id-ID', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
}
function toast(msg, ok=true){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = `toast ${ok?'':''}`;
  el.style.background = ok ? 'linear-gradient(135deg,#10b981,#059669)' : 'linear-gradient(135deg,#ef4444,#dc2626)';
  el.innerHTML = `${ok?ICONS.check:ICONS.x}<span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3500);
}
function getLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation) return reject(new Error('Perangkat tidak mendukung GPS'));
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      err => reject(err),
      { enableHighAccuracy:true, timeout:15000, maximumAge:0 }
    );
  });
}
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function skeleton(lines=3){
  return `<div class="space-y-2">${Array.from({length:lines}).map(()=>`<div class="skeleton h-4 w-full"></div>`).join('')}</div>`;
}
function showModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal-box">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

// Reverse geocode gratis via Nominatim (OpenStreetMap) — best-effort, tanpa API key.
async function reverseGeocode(lat, lng){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
    const data = await res.json();
    const a = data.address || {};
    return {
      kelurahan: a.village || a.suburb || a.neighbourhood || a.hamlet || '',
      kecamatan: a.suburb || a.city_district || a.county || a.district || '',
      kota: a.city || a.town || a.municipality || a.county || a.state || ''
    };
  }catch(e){ return { kelurahan:'', kecamatan:'', kota:'' }; }
}

function nearestOffice(lat, lng){
  let best = null;
  officesCache.forEach(o=>{
    if(o.lat==null || o.lng==null) return;
    const d = haversineMeters(lat, lng, o.lat, o.lng);
    if(!best || d < best.distance) best = { office:o, distance:d };
  });
  return best;
}
function todayShift(profile){
  const dow = new Date().getDay();
  const day = DAYS.find(d=>d.dow===dow);
  const shiftId = profile.schedule ? profile.schedule[day.key] : null;
  return shiftId ? shiftsCache.find(s=>s.id===shiftId) || null : null;
}

/* =========================================================
   AUTH
========================================================= */
auth.onAuthStateChanged(async (user) => {
  currentUser = user;
  if(!user){ currentProfile = null; renderLogin(); return; }
  renderLoadingShell();
  await ensureUserProfile(user);
  await loadGlobalData();
  route();
});

async function ensureUserProfile(user){
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if(!snap.exists){
    const role = (user.email === SUPERADMIN_EMAIL) ? 'superadmin' : 'karyawan';
    await ref.set({
      name: user.displayName || user.email.split('@')[0],
      nik: '',
      email: user.email,
      role,
      active: true,
      schedule: {},
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }
  const fresh = await ref.get();
  currentProfile = { id: fresh.id, ...fresh.data() };
}

async function loadGlobalData(){
  const [officeSnap, shiftSnap] = await Promise.all([
    db.collection('offices').get(),
    db.collection('shifts').get()
  ]);
  officesCache = officeSnap.docs.map(d => ({id:d.id, ...d.data()}));
  shiftsCache = shiftSnap.docs.map(d => ({id:d.id, ...d.data()}));
}

// Ambil ulang profil terbaru dari Firestore, supaya perubahan Nama/NIK/Jadwal
// yang dilakukan admin langsung terlihat oleh karyawan tanpa perlu logout-login.
async function refreshCurrentProfile(){
  const snap = await db.collection('users').doc(currentUser.uid).get();
  if(snap.exists) currentProfile = { id: snap.id, ...snap.data() };
}

function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>toast(e.message,false));
}
function registerEmail(email, pass, name){
  if(!email || !pass || !name) return toast('Lengkapi semua field', false);
  auth.createUserWithEmailAndPassword(email, pass)
    .then(cred => cred.user.updateProfile({displayName:name}))
    .catch(e=>toast(e.message,false));
}
function loginEmail(email, pass){
  auth.signInWithEmailAndPassword(email, pass).catch(e=>toast(e.message,false));
}
function logout(){ auth.signOut(); }

function renderLoadingShell(){
  app.innerHTML = `<div class="pt-16 max-w-md mx-auto">${skeleton(1)}<div class="h-4"></div>${skeleton(4)}</div>`;
}

/* =========================================================
   ROUTER
========================================================= */
function route(){
  if(!currentProfile.active){
    app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center px-4">
      <div class="glass p-8 text-center max-w-sm card-anim">
        <div class="mx-auto mb-3 w-14 h-14 rounded-2xl bg-red-100 text-red-600 flex items-center justify-center">${ICONS.x}</div>

function toggleEmpMap(){
  const wrap = document.getElementById('emp-map-wrap');
  empMapVisible = !empMapVisible;
  wrap.classList.toggle('hidden', !empMapVisible);
  document.getElementById('map-toggle-label').textContent = empMapVisible ? 'Sembunyikan Peta' : 'Lihat Peta Lokasi Kantor';
  if(empMapVisible) setTimeout(()=>{ initEmpMap(); locateMeOnEmpMap(); }, 50);
}

function initEmpMap(){
  const officesWithLoc = officesCache.filter(o=>o.lat!=null);
  const center = officesWithLoc.length ? [officesWithLoc[0].lat, officesWithLoc[0].lng] : [-6.9, 107.6];
  if(empMapObj){ empMapObj.remove(); empMapObj = null; }
  empMapObj = L.map('emp-map').setView(center, officesWithLoc.length ? 15 : 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap' }).addTo(empMapObj);
  const bounds = [];
  officesWithLoc.forEach(o=>{
    L.marker([o.lat,o.lng]).addTo(empMapObj).bindPopup(`<b>${o.label}</b><br>Radius ${o.radius}m`);
    L.circle([o.lat,o.lng], { radius:o.radius, color:'#4f46e5', fillColor:'#4f46e5', fillOpacity:.12 }).addTo(empMapObj);
    bounds.push([o.lat,o.lng]);
  });
  if(bounds.length>1) empMapObj.fitBounds(bounds, {padding:[30,30]});
  window.__empUserMarker = null;
  window.__empUserAccuracyCircle = null;
}

// Ambil lokasi GPS karyawan saat ini dan tampilkan sebagai titik biru berdenyut (gaya Google Maps).
async function locateMeOnEmpMap(){
  const statusEl = document.getElementById('clock-status');
  try{
    const coords = await getLocation();
    plotUserOnEmpMap(coords.latitude, coords.longitude, coords.accuracy);
  }catch(e){
    if(statusEl) statusEl.textContent = 'Tidak bisa mendeteksi lokasi Anda: ' + (e.message || e);
  }
}

const userDotIcon = L.divIcon({
  className: '',
  html: `<div class="user-dot-wrap"><div class="user-dot-pulse"></div><div class="user-dot-core"></div></div>`,
  iconSize: [22,22],
  iconAnchor: [11,11]
});

function plotUserOnEmpMap(lat, lng, accuracy){
  if(!empMapObj) return;
  if(window.__empUserMarker) empMapObj.removeLayer(window.__empUserMarker);
  if(window.__empUserAccuracyCircle) empMapObj.removeLayer(window.__empUserAccuracyCircle);
  if(accuracy){
    window.__empUserAccuracyCircle = L.circle([lat,lng], { radius:accuracy, color:'#4285F4', weight:1, fillColor:'#4285F4', fillOpacity:.08 }).addTo(empMapObj);
  }
  window.__empUserMarker = L.marker([lat,lng], { icon:userDotIcon, zIndexOffset:1000 }).addTo(empMapObj).bindPopup('Posisi Anda saat ini');
  empMapObj.panTo([lat,lng]);
}

async function getLastAttendance(uid){
  const snap = await db.collection('attendance')
    .where('uid','==',uid).orderBy('timestamp','desc').limit(1).get();
  if(snap.empty) return null;
  return snap.docs[0].data();
}

async function doClock(type){
  const btn = document.getElementById(type==='in' ? 'clock-in-btn' : 'clock-out-btn');
  const otherBtn = document.getElementById(type==='in' ? 'clock-out-btn' : 'clock-in-btn');
  const statusEl = document.getElementById('clock-status');
  btn.disabled = true;
  otherBtn.disabled = true;
  statusEl.textContent = 'Mengambil lokasi GPS...';
  try{
    if(officesCache.length===0){
      toast('Belum ada kantor yang diatur admin', false); btn.disabled=false; otherBtn.disabled=false; statusEl.textContent=''; return;
    }
    const coords = await getLocation();
    if(empMapVisible) plotUserOnEmpMap(coords.latitude, coords.longitude, coords.accuracy);

    if(coords.accuracy && coords.accuracy > 150){
      statusEl.textContent = `Sinyal GPS kurang akurat (± ${Math.round(coords.accuracy)}m). Coba di tempat terbuka.`;
      btn.disabled = false; otherBtn.disabled = false; return;
    }

    const nearest = nearestOffice(coords.latitude, coords.longitude);
    if(!nearest){
      statusEl.textContent = 'Belum ada kantor dengan lokasi yang valid.'; btn.disabled=false; otherBtn.disabled=false; return;
    }
    if(nearest.distance > nearest.office.radius){
      statusEl.textContent = `Anda ${Math.round(nearest.distance)}m dari kantor terdekat "${nearest.office.label}" (maks ${nearest.office.radius}m). Absen ditolak.`;
      btn.disabled = false; otherBtn.disabled = false; return;
    }

    const shift = todayShift(currentProfile);
    await db.collection('attendance').add({
      uid: currentUser.uid,
      name: currentProfile.name,
      nik: currentProfile.nik || '',
      type,
      shiftId: shift ? shift.id : null,
      officeId: nearest.office.id,
      officeLabel: nearest.office.label,
      lat: coords.latitude,
      lng: coords.longitude,
      accuracy: coords.accuracy || null,
      distance: Math.round(nearest.distance),
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast(type==='in' ? `Clock In berhasil di ${nearest.office.label}` : `Clock Out berhasil di ${nearest.office.label}`);
    renderEmployeeDashboard();
  }catch(e){
    statusEl.textContent = 'Gagal mengambil lokasi: ' + (e.message || e);
    btn.disabled = false; otherBtn.disabled = false;
  }
}

  const rows = snap.docs.map(d=>d.data());

function initOfficeMap(){
  const center = officesCache.length ? [officesCache[0].lat, officesCache[0].lng] : [-6.9, 107.6];

  officeMapObj = L.map('office-map').setView(center, officesCache.length?14:5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap' }).addTo(officeMapObj);
  officesCache.forEach(o=>{
    if(o.lat==null) return;
    L.circle([o.lat,o.lng], { radius:o.radius, color:'#94a3b8', fillColor:'#94a3b8', fillOpacity:.1 }).addTo(officeMapObj)
      .bindPopup(`<b>${o.label}</b>`);
  });
  officeMapObj.on('click', (e)=> setOfficeMarker(e.latlng.lat, e.latlng.lng));
  pendingOfficeCoords = null;
}
function setOfficeMarker(lat, lng){
  pendingOfficeCoords = { lat, lng };
  if(officeMarker) officeMapObj.removeLayer(officeMarker);
  officeMarker = L.marker([lat,lng], {draggable:true}).addTo(officeMapObj);
  officeMarker.on('dragend', ()=>{
    const p = officeMarker.getLatLng();
    pendingOfficeCoords = { lat:p.lat, lng:p.lng };
    document.getElementById('of-coords').textContent = `Koordinat: ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
  });
  document.getElementById('of-coords').textContent = `Koordinat: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}

    const c = await getLocation();

async function detectAddressForOffice(){
  if(!pendingOfficeCoords) return toast('Tandai lokasi di peta dahulu', false);

  const addr = await reverseGeocode(pendingOfficeCoords.lat, pendingOfficeCoords.lng);
  document.getElementById('of-kelurahan').value = addr.kelurahan;
  document.getElementById('of-kecamatan').value = addr.kecamatan;
  document.getElementById('of-kota').value = addr.kota;
  toast('Alamat terdeteksi (silakan periksa & sunting jika perlu)');

    label,

    lng: pendingOfficeCoords.lng,
    radius: parseInt(val('of-radius')),
    kelurahan: val('of-kelurahan'),

/* ---- Tab: Data Absensi (Data Mentah + Rekap Harian) + Export Excel ---- */
let absensiView = 'rekap';
let lastAttendanceRows = [];
let lastRekapRows = [];

function renderTabAbsensi(c){
  const today = new Date().toISOString().slice(0,10);
  const monthAgo = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  c.innerHTML = `
  <div class="card p-5 mb-4 card-anim">
    <div class="pill-tabs mb-4">
      <button class="pill-tab ${absensiView==='rekap'?'active':''}" onclick="setAbsensiView('rekap')">Rekap Harian</button>
      <button class="pill-tab ${absensiView==='mentah'?'active':''}" onclick="setAbsensiView('mentah')">Data Mentah</button>
    </div>
    <div class="flex flex-wrap gap-3 items-end">
      <div><label class="field-label">Dari</label><input id="af-from" type="date" value="${monthAgo}"></div>
      <div><label class="field-label">Sampai</label><input id="af-to" type="date" value="${today}"></div>
      <button onclick="loadAttendanceData()" class="btn btn-outline">Tampilkan</button>
      <button onclick="exportExcel()" class="btn btn-primary">${ICONS.chart} Export Excel</button>
    </div>
  </div>
  <div class="card p-5 overflow-x-auto card-anim"><div id="att-table" class="text-sm text-slate-400">Pilih rentang tanggal lalu klik Tampilkan.</div></div>
  `;
}
function setAbsensiView(v){ absensiView = v; switchTab('absensi'); }

async function loadAttendanceData(){
  const el = document.getElementById('att-table');
  el.innerHTML = skeleton(5);
  const from = new Date(val('af-from'));
  const to = new Date(val('af-to')); to.setHours(23,59,59,999);
  const [attSnap, usersSnap] = await Promise.all([
    db.collection('attendance').where('timestamp','>=', from).where('timestamp','<=', to).orderBy('timestamp','desc').get(),
    db.collection('users').get()
  ]);
  lastAttendanceRows = attSnap.docs.map(d=>d.data());
  const userMap = {};
  usersSnap.docs.forEach(d=>{ userMap[d.id] = {id:d.id, ...d.data()}; });

  if(absensiView === 'mentah'){ renderRawTable(el); return; }
  buildRekapHarian(userMap);
  renderRekapTable(el);
}

function renderRawTable(el){
  if(lastAttendanceRows.length===0){ el.innerHTML = '<div class="text-slate-400 text-sm">Tidak ada data pada rentang ini.</div>'; return; }
  el.innerHTML = `<table class="data-table"><thead><tr>
    <th>Nama</th><th>Waktu</th><th>Jenis</th><th>Kantor</th><th>Jarak</th><th>Jadwal Masuk</th><th>Jadwal Pulang</th></tr></thead><tbody>
    ${lastAttendanceRows.map(r=>{
      const shift = r.shiftId ? shiftsCache.find(s=>s.id===r.shiftId) : null;
      return `<tr><td>${r.name}</td>
      <td>${fmtTime(r.timestamp)}</td><td>${r.type==='in'?'Masuk':'Keluar'}</td>
      <td>${r.officeLabel||'-'}</td><td>${r.distance}m</td>
      <td>${shift?shift.startTime:'-'}</td><td>${shift?shift.endTime:'-'}</td></tr>`;
    }).join('')}
    </tbody></table>`;
}

// Susun rekap harian: per karyawan per hari, clock-in pertama & clock-out terakhir.
function buildRekapHarian(userMap){
  const groups = {}; // key: uid|date
  lastAttendanceRows.forEach(r=>{
    const dk = dateKey(r.timestamp);
    const key = `${r.uid}|${dk}`;
    if(!groups[key]) groups[key] = { uid:r.uid, name:r.name, date:dk, ins:[], outs:[], shiftIds:[] };
    if(r.type==='in') groups[key].ins.push(r.timestamp);
    else groups[key].outs.push(r.timestamp);
    if(r.shiftId) groups[key].shiftIds.push(r.shiftId);
  });
  const rows = Object.values(groups).map(g=>{
    g.ins.sort((a,b)=> (a.toDate?a.toDate():new Date(a)) - (b.toDate?b.toDate():new Date(b)));
    g.outs.sort((a,b)=> (a.toDate?a.toDate():new Date(a)) - (b.toDate?b.toDate():new Date(b)));
    const firstIn = g.ins[0] || null;
    const lastOut = g.outs[g.outs.length-1] || null;
    const u = userMap[g.uid];
    const nik = u ? u.nik : '';

    // Prioritaskan shift yang tersimpan di record absensi (akurat sesuai saat itu).
    // Fallback ke jadwal saat ini jika data lama belum menyimpan shiftId.
    let shift = null;
    if(g.shiftIds.length){
      shift = shiftsCache.find(s=>s.id===g.shiftIds[0]) || null;
    }
    if(!shift && u && u.schedule){
      const d = new Date(g.date+'T00:00:00');
      const dow = d.getDay();
      const dayObj = DAYS.find(x=>x.dow===dow);
      const shiftId = u.schedule[dayObj.key];
      shift = shiftId ? shiftsCache.find(s=>s.id===shiftId) : null;
    }

    let status, statusClass;
    if(!firstIn && lastOut){ status='Lupa Clock In'; statusClass='badge-danger'; }
    else if(firstIn && !lastOut){ status='Lupa Clock Out'; statusClass='badge-warn'; }
    else if(firstIn && shift){
      const inDate = firstIn.toDate ? firstIn.toDate() : new Date(firstIn);
      const [h,m] = shift.startTime.split(':').map(Number);
      const shiftStart = new Date(inDate); shiftStart.setHours(h,m,0,0);
      const lateMin = Math.round((inDate - shiftStart)/60000);
      if(lateMin > 0){ status = `Terlambat ${lateMin} menit`; statusClass='badge-danger'; }
      else { status = 'Tepat Waktu'; statusClass='badge-ok'; }
    } else if(firstIn){ status='Tepat Waktu'; statusClass='badge-ok'; }
    else { status='-'; statusClass='badge-muted'; }

    return { uid:g.uid, name:g.name, nik, date:g.date, firstIn, lastOut, status, statusClass, shift };
  }).sort((a,b)=> b.date.localeCompare(a.date) || a.name.localeCompare(b.name));
  lastRekapRows = rows;
}

function renderRekapTable(el){
  if(lastRekapRows.length===0){ el.innerHTML = '<div class="text-slate-400 text-sm">Tidak ada data pada rentang ini.</div>'; return; }
  el.innerHTML = `<table class="data-table"><thead><tr>
    <th>Tanggal</th><th>Nama</th><th>NIK</th><th>Jadwal Masuk</th><th>Jadwal Pulang</th><th>Jam Masuk</th><th>Jam Keluar</th><th>Status</th></tr></thead><tbody>
    ${lastRekapRows.map(r=>`<tr>
      <td>${fmtDateLabel(r.date)}</td>
      <td>${r.name}</td>
      <td>${r.nik||'-'}</td>
      <td>${r.shift?r.shift.startTime:'-'}</td>
      <td>${r.shift?r.shift.endTime:'-'}</td>
      <td>${fmtClock(r.firstIn)}</td>
      <td>${fmtClock(r.lastOut)}</td>
      <td><span class="badge ${r.statusClass}">${r.status}</span></td>
    </tr>`).join('')}
    </tbody></table>`;
}

function exportExcel(){
  if(absensiView==='mentah'){
    if(lastAttendanceRows.length===0) return toast('Tampilkan data dahulu sebelum export',false);
    const data = lastAttendanceRows.map(r=>{
      const shift = r.shiftId ? shiftsCache.find(s=>s.id===r.shiftId) : null;
      return {
        Nama: r.name, Waktu: fmtTime(r.timestamp), Jenis: r.type==='in'?'Masuk':'Keluar',
        Kantor: r.officeLabel||'-', 'Jarak (m)': r.distance,
        'Jadwal Masuk': shift?shift.startTime:'-', 'Jadwal Pulang': shift?shift.endTime:'-',
        Latitude: r.lat, Longitude: r.lng
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Data Mentah');
    XLSX.writeFile(wb, `absensi-mentah-${new Date().toISOString().slice(0,10)}.xlsx`);
  } else {
    if(lastRekapRows.length===0) return toast('Tampilkan data dahulu sebelum export',false);
    const data = lastRekapRows.map(r=>({
      Tanggal: fmtDateLabel(r.date), Nama: r.name, NIK: r.nik||'-',
      'Jadwal Masuk': r.shift?r.shift.startTime:'-', 'Jadwal Pulang': r.shift?r.shift.endTime:'-',
      'Jam Masuk': fmtClock(r.firstIn), 'Jam Keluar': fmtClock(r.lastOut), Status: r.status
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rekap Harian');
    XLSX.writeFile(wb, `rekap-harian-${new Date().toISOString().slice(0,10)}.xlsx`);
  }
}
